# ── Release version — THE ONE PLACE IT LIVES ────────────────────────────────────────────────────
# Bump this for every store release, and nothing else.
#
# WHY IT IS AN ANCHOR AND NOT TWO LITERALS: the iOS lane used to run
# `agvtool new-marketing-version 1.0` hardcoded, which silently OVERWROTE whatever MARKETING_VERSION
# the Xcode project held. Bumping the version in Xcode looked correct, built clean, and produced
# 1.0 anyway — and App Store Connect then refuses to attach the build, because 1.0 is already
# released. No error appears in the build log; the failure surfaces days later at submission. The
# anchor means iOS and Android cannot drift from each other or from this file either.
#
# A RELEASED VERSION IS BURNED FOREVER. 1.1 was approved on the App Store, which CLOSES its
# pre-release train: build 21 archived, signed and exported cleanly, then died at the publish step
# on `ITMS 90186 — the train version '1.1' is closed for new build submissions` plus `90062 —
# CFBundleShortVersionString [1.1] must contain a higher version than the previously approved
# version [1.1]`. Note where that lands: the BUILD passes and the UPLOAD fails, so the cost is a
# whole green build plus the minutes, and nothing in the code is wrong. Bump this BEFORE running a
# lane that publishes, not after it fails.
definitions:
  app_version: &app_version "1.2"

workflows:
  ios-testflight:
    name: Rot Royale iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic-rot-royale

    environment:
      # 22, not 20: Node 20 went EOL 2026-04-30, and .github/workflows/ci.yml already builds on 22 —
      # so pinning 20 here meant the STORE BINARY was produced on a different, unsupported runtime
      # from the one that validates every PR. The lane that matters least to catch a regression on
      # was the only one still on it. (Capacitor 8 will also require 22+; this is a prerequisite.)
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          # THIS IS A CODEMAGIC REFERENCE NAME, not the profile's name in Apple's portal and not a
          # filename. Codemagic signs from the file uploaded to Team settings -> Code signing
          # identities and looks it up by this string; it does NOT fetch anything from App Store
          # Connect at build time. So re-issuing a profile in Apple's portal fixes nothing here on
          # its own — the new .mobileprovision has to be uploaded, and this name has to match the
          # reference it was given. A mismatch fails with "No provisioning profile with reference
          # '<name>' were found", which names the available options and is the quickest way to see
          # what the store actually holds.
          #
          # Renamed from `rot_royale_push_profile_20260716`: that profile was invalidated the moment
          # Sign in with Apple was added to the App ID (any entitlement change invalidates every
          # existing profile), and the re-issued upload came in under this name. The old name had
          # also stopped being true — it says "push", and the profile now carries push AND Sign in
          # with Apple.
          - profile: Rot Royale Upload
            environment_variable: ROT_ROYALE_PROFILE_PATH
        certificates:
          - rotroyale_distribution
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_VERSION: *app_version

    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm ci

      - name: Build Vite web app
        script: |
          cd frontend
          npm run build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install

      - name: Set up iOS signing
        script: |
          set -euo pipefail

          echo "Verifying explicitly selected Rot Royale provisioning profile..."

          if [ -z "${ROT_ROYALE_PROFILE_PATH:-}" ]; then
            echo "ERROR: ROT_ROYALE_PROFILE_PATH was not provided by Codemagic."
            exit 1
          fi

          if [ ! -f "$ROT_ROYALE_PROFILE_PATH" ]; then
            echo "ERROR: Provisioning profile file does not exist at $ROT_ROYALE_PROFILE_PATH"
            exit 1
          fi

          security cms -D -i "$ROT_ROYALE_PROFILE_PATH" > /tmp/rot-profile.plist

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/rot-profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/rot-profile.plist)
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/rot-profile.plist)
          PUSH_ENV=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" /tmp/rot-profile.plist)

          echo "Profile name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Application identifier: $APP_IDENTIFIER"
          echo "Push environment: $PUSH_ENV"

          if [ "$PROFILE_UUID" != "b4c19ed7-1ba3-429d-a5e6-edafaf1a3a8c" ]; then
            echo "ERROR: Codemagic loaded the wrong provisioning profile."
            exit 1
          fi

          if [ "$APP_IDENTIFIER" != "X7A3NVYX8K.live.rotroyale.app" ]; then
            echo "ERROR: Provisioning profile has the wrong application identifier."
            exit 1
          fi

          if [ "$PUSH_ENV" != "production" ]; then
            echo "ERROR: Provisioning profile is missing the production push entitlement."
            exit 1
          fi

          cd frontend/ios/App
          xcode-project use-profiles

      - name: Verify profile has push
        script: |
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            echo "=== $p ==="
            security cms -D -i "$p" 2>/dev/null | plutil -p - | grep -A1 -E "aps-environment|Name"
          done

      - name: Set iOS version and build number
        script: |
          set -euo pipefail
          cd frontend/ios/App
          # Marketing version = the store-facing version users see, and the version record App Store
          # Connect attaches the build to. Build number just has to be unique within it.
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
          # Print both — a wrong version is invisible in a green build log otherwise.
          agvtool what-marketing-version -terse1
          agvtool what-version -terse

      - name: Build signed IPA
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      # This DOES upload the IPA to App Store Connect. The two flags below only control what happens
      # afterwards, in post-processing: submission to TestFlight beta review (required for EXTERNAL
      # testers) and submission to App Store review. With both false the build still lands in App
      # Store Connect and is installable by INTERNAL TestFlight testers once it finishes processing.
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  # ── Android / Google Play ──────────────────────────────────────────────────────────────────────
  # Mirrors ios-testflight: same npm ci → vite build → cap sync, then a signed AAB instead of an
  # IPA. Runs on Linux (no Mac needed), so it's cheaper and faster than the iOS lane.
  #
  # Before the first run, set these in the Codemagic UI:
  #   • Group `google_play` with CM_KEYSTORE (base64 .jks), CM_KEYSTORE_PASSWORD,
  #     CM_KEY_ALIAS, CM_KEY_PASSWORD  — or use Codemagic's Android code-signing UI, which
  #     populates the same variables.
  #   • Integration `codemagic-rot-royale-play` — a Google Play service account with
  #     "Release to testing tracks" permission.
  #
  # ⚠️ THIS LANE CANNOT PRODUCE A PUBLISHABLE ARTIFACT TODAY. Play has required targetSdk 36 for new
  # apps and updates since 2026-08-31; variables.gradle is at 35, and reaching 36 means Capacitor 8
  # (Capacitor 7 tops out at 35). See docs/android-play-store-prep.md. The lane still builds a
  # signed AAB, which is useful for a first green build — it just will not pass review.
  #
  # NOTE ON UPLOADS — this used to say "uploads are left DISABLED below, same as the iOS lane", and
  # that was wrong about BOTH lanes. `publishing.google_play` below is fully configured, so a
  # successful build UPLOADS to the internal track as a draft. On the iOS lane,
  # `publishing.app_store_connect` likewise uploads the IPA to App Store Connect;
  # `submit_to_testflight: false` only skips TestFlight BETA REVIEW (needed for external testers) —
  # internal testers can install the build regardless. Neither flag prevents an upload. If you want
  # a genuinely local artifact, delete the publishing block rather than trusting these flags.
  android-play:
    name: Rot Royale Android (Play)
    max_build_duration: 90
    instance_type: linux_x2

    environment:
      node: 22 # see the iOS lane: 20 is EOL and CI builds on 22
      # 21, not 17: Capacitor 7 already required JDK 21 and Capacitor 8 inherits it, so this moved
      # in the same branch as the upgrade exactly as the previous comment here predicted. 17 was
      # correct only for AGP 8.2.1; against AGP 8.13.0 it fails inside Gradle, looking nothing like
      # a Capacitor problem. See docs/android-play-store-prep.md.
      java: 21
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "live.rotroyale.app"
        APP_VERSION: *app_version

    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm ci

      - name: Build Vite web app
        script: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        script: |
          cd frontend
          npx cap sync android

      - name: Set Android version name and code
        script: |
          set -euo pipefail
          # versionCode: Play rejects one it has seen before, so it tracks the build number rather
          # than the placeholder in build.gradle. versionName: the store-facing string, kept in
          # lockstep with iOS via the app_version anchor.
          #
          # Both patterns match the VALUE, not a literal. The previous `s/versionCode 1/...` was a
          # prefix match: against `versionCode 12` it would rewrite the leading 1 and leave the 2,
          # turning build 5 into versionCode 52. It only worked while the file stayed pinned at 1,
          # and would have failed silently the first time it didn't.
          cd frontend/android
          sed -i -E "s/versionCode [0-9]+/versionCode $BUILD_NUMBER/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" app/build.gradle
          grep -nE "versionCode|versionName" app/build.gradle

      - name: Set up keystore
        script: |
          set -euo pipefail
          if [ -z "${CM_KEYSTORE:-}" ]; then
            echo "ERROR: CM_KEYSTORE is not set — add the google_play variable group in Codemagic."
            exit 1
          fi
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks
          cat > frontend/android/key.properties <<EOF
          storeFile=/tmp/keystore.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      - name: Build signed AAB
        script: |
          set -euo pipefail
          cd frontend/android
          # Play requires an App Bundle for new apps; the APK is built too for local sideload QA.
          ./gradlew bundleRelease assembleRelease

    artifacts:
      - frontend/android/app/build/outputs/bundle/release/*.aab
      - frontend/android/app/build/outputs/apk/release/*.apk
      - frontend/android/app/build/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true